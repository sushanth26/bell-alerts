name: bell-bot
on:
  schedule:
    # GitHub cron is UTC; each pair covers daylight time (Mar-Nov) and standard time (Nov-Mar), the other exits at once.
    - cron: '20 13 * * 1-5'   # 9:20 ET morning: trade the alerts until 11:00
    - cron: '20 14 * * 1-5'
    - cron: '35 19 * * 1-5'   # 15:35 ET: close what the bot still holds
    - cron: '35 20 * * 1-5'
    - cron: '*/15 15-21 * * 1-5'  # dashboard refresh every 15 minutes between the windows (report only)
  workflow_dispatch:
    inputs:
      mode:
        description: 'report = print today''s bot orders and P&L · trade = run now (does nothing outside 9:00-11:00 and 15:30-16:00 ET)'
        type: choice
        options: [report, trade]
        default: report
concurrency:
  group: bell-bot
  cancel-in-progress: false
permissions:
  contents: write   # the bot pushes data/bot/*.json for the dashboard
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          git config user.name "bell-bot"
          git config user.email "bell-bot@users.noreply.github.com"
      - run: python -u main.py trade ${{ inputs.mode == 'report' && 'report' || '' }}
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADE_KEY_ID: ${{ secrets.TRADE_KEY_ID }}
          TRADE_SECRET_KEY: ${{ secrets.TRADE_SECRET_KEY }}
          FEED: ${{ vars.FEED || 'iex' }}
          RISK: ${{ vars.RISK || '100' }}
          TRADING: ${{ vars.TRADING || 'off' }}
          ALPACA_LIVE: ${{ vars.ALPACA_LIVE || 'no' }}
          MAX_TRADES: ${{ vars.MAX_TRADES || '6' }}
          MAX_LOSS_R: ${{ vars.MAX_LOSS_R || '3' }}
          MAX_POS_USD: ${{ vars.MAX_POS_USD || '25000' }}
